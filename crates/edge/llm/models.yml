# Built-in models, in the shape of omp's ~/.omp/agent/models.yml: a provider block copies
# between the two files unchanged. Values are omp's own catalog for its subscription logins.
#
# `auth: oauth` marks a subscription provider: it exists only while `hrn login claude` /
# `hrn login chatgpt` has written its credentials, and a subscription has no per-token
# billing, so `cost` is informational there (hrn computes no dollars for it).
#
# Layers, highest priority first: `[models.*]` in config.toml, ~/.harness/models.yml (this
# shape), ~/.omp/agent/models.yml (imported), this file. Models are named <provider>/<id>.
providers:
  anthropic:
    api: anthropic-messages
    auth: oauth
    models:
      - id: claude-fable-5
        name: Claude Fable 5
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }
