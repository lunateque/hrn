# hrn built-in slash commands — compiled in.
#
# Each `[[command]]` row declares one built-in slash command backed by a
# `slash::Command` variant in `crates/front/tui/src/slash.rs`.
# Fields:
#   name        (required) primary slash name without leading `/`
#   aliases     (optional) alternate slash names resolving to the same command
#   args        (optional) argument synopsis shown in the completion popup
#   subcommands (optional) static first-argument completions
#   hint        (optional) inline hint shown beside argument/subcommand choices
#   help        (required) one-line description shown in the completion popup

[[command]]
name = "login"
args = "[provider]"
hint = "provider, provider <api-key>, or redirect URL"
help = "log in to a subscription or configure provider API keys"

[[command]]
name = "logout"
args = "[provider]"
hint = "provider name"
help = "remove stored credentials for a provider"

[[command]]
name = "setup"
help = "first-run onboarding wizard (login, default role, theme)"

[[command]]
name = "auth"
help = "show provider auth status"

[[command]]
name = "model"
args = "[alias]"
hint = "model alias"
help = "open the roles/models hub or switch model"

[[command]]
name = "switch"
args = "[model]"
hint = "model alias"
help = "temporarily switch the session model without touching roles"

[[command]]
name = "think"
args = "<level>"
hint = "thinking effort"
help = "set the thinking effort"

[[command]]
name = "fast"
args = "[ultra|off]"
subcommands = ["ultra", "off"]
hint = "service tier"
help = "toggle priority service tier (or /fast ultra)"

[[command]]
name = "slow"
args = "[on|off]"
subcommands = ["on", "off"]
hint = "slow mode"
help = "toggle Anthropic subscription slow-mode lane"

[[command]]
name = "extended-context"
args = "[on|off|status]"
subcommands = ["on", "off", "status"]
hint = "extended context"
help = "toggle extended context window (max_context_window)"

[[command]]
name = "mode"
args = "<mode>"
hint = "permission mode"
help = "set the permission mode"

[[command]]
name = "forget-approvals"
help = "clear remembered and session approval grants"

[[command]]
name = "plan"
args = "[on|off|<prompt>]"
subcommands = ["on", "off"]
hint = "plan mode"
help = "toggle read-only plan mode"

[[command]]
name = "advisor"
args = "[on|off|model <alias>]"
subcommands = ["on", "off", "model"]
hint = "advisor reviewer"
help = "toggle passive post-turn reviewer"

[[command]]
name = "attach"
args = "<path>"
hint = "path to an image file"
help = "attach an image file ([Image #N])"

[[command]]
name = "image"
args = "<N>"
hint = "image attachment number"
help = "open larger preview for [Image #N]"

[[command]]
name = "tree"
help = "browse and branch session history"

[[command]]
name = "branch"
aliases = ["rewind"]
help = "rewind or branch from a user turn (last 600 nodes)"

[[command]]
name = "fork"
args = "[node]"
hint = "optional node id"
help = "fork the session from head or a node"

[[command]]
name = "new"
aliases = ["clear"]
help = "start a new session"

[[command]]
name = "sessions"
aliases = ["resume"]
help = "pick a session to resume"

[[command]]
name = "compact"
args = "[instructions]"
hint = "optional compaction instructions"
help = "fold older history into a summary"

[[command]]
name = "shake"
help = "elide large old tool outputs to local:// without an LLM call"

[[command]]
name = "handoff"
args = "[focus]"
hint = "optional handoff focus"
help = "write a structured handoff summary for a fresh context"

[[command]]
name = "btw"
args = "[question]"
hint = "side question (bare opens history)"
help = "ask a tool-free side question without touching session history"

[[command]]
name = "export"
args = "[path]"
hint = "output .md or .html path"
help = "write the session to markdown or html"

[[command]]
name = "share"
args = "[--no-redact]"
subcommands = ["--no-redact"]
hint = "sealed share link"
help = "seal and share the current session as an encrypted link"

[[command]]
name = "collab"
args = "[view|status|stop]"
subcommands = ["view", "status", "stop"]
hint = "live collaboration"
help = "host a live encrypted collaboration room for this session"

[[command]]
name = "join"
args = "<link>"
hint = "collab room link"
help = "join a live collaboration room as a guest"

[[command]]
name = "leave"
help = "leave the active collaboration room"

[[command]]
name = "goal"
args = "[objective|pause|resume|drop]"
subcommands = ["pause", "resume", "drop"]
hint = "goal mode"
help = "goal mode: work autonomously until done"

[[command]]
name = "modelpreset"
args = "[save <n>|switch <n>|delete <n>|list]"
subcommands = ["save", "switch", "delete", "list"]
hint = "model preset"
help = "named model-role bundles"

[[command]]
name = "stats"
help = "view usage statistics"

[[command]]
name = "settings"
help = "show the effective configuration"

[[command]]
name = "context"
help = "break down the context window"

[[command]]
name = "tools"
help = "list the session's tools"

[[command]]
name = "mcp"
args = "[resources]"
subcommands = ["resources"]
hint = "MCP view"
help = "list MCP servers or advertised resources (/mcp resources)"

[[command]]
name = "jobs"
help = "list background jobs (proc://)"

[[command]]
name = "todo"
args = "[edit]"
subcommands = ["edit"]
hint = "todo list"
help = "show or edit the session's todo list"

[[command]]
name = "pin"
args = "[session]"
hint = "session id"
help = "pin a session in /sessions"

[[command]]
name = "unpin"
args = "[session]"
hint = "session id"
help = "unpin a session"

[[command]]
name = "delete"
args = "[session]"
