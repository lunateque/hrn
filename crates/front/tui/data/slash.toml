[[command]]
name = "rename"
args = "[title]"
hint = "new session title (omit to regenerate)"
help = "title the current session or regenerate it with the title model"

[[command]]
name = "retry"
help = "replay the last turn (F5)"

[[command]]
name = "copy"
help = "copy the last answer to the clipboard"

[[command]]
name = "hotkeys"
aliases = ["keybindings"]
help = "show the key bindings"

[[command]]
name = "usage"
help = "show provider usage and limits"

[[command]]
name = "help"
help = "keys and commands"

[[command]]
name = "quit"
aliases = ["exit"]
help = "exit"

[[command]]
name = "agents"
help = "open the agent definitions hub (enable/disable and model overrides)"

[[command]]
name = "theme"
args = "[name] [save]"
hint = "theme name (append `save` to persist)"
help = "list themes, preview a theme live, or persist it with `save`"

[[command]]
name = "queue"
args = "[message]"
