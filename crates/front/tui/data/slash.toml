[[command]]
name = "dump"
args = "[file]"
hint = "optional output file (omit to copy to clipboard)"
help = "dump the plain-text session transcript to the clipboard or a file"

[[command]]
name = "commit"
help = "stage and commit only this session's attributed edits"

[[command]]
name = "git"
args = "[revision]"
hint = "optional git revision to inspect"
help = "open interactive git status, diff, staging, and commit workbench"

[[command]]
name = "remote"
args = "[view|lan|relay|status|stop]"
subcommands = ["view", "lan", "relay", "status", "stop"]
hint = "remote pairing mode"
help = "pair a phone or browser via QR code (HTTPS tunnel by default, or `lan`)"

[[command]]
name = "review"
args = "[staged|base|<focus>]"
subcommands = ["staged", "base"]
hint = "review target or focus"
help = "run a structured P0-P3 code review of current changes"

[[command]]
name = "vibe"
args = "[on|off|status]"
subcommands = ["on", "off", "status"]
hint = "vibe mode"
help = "toggle low-friction auto-edit coding mode"

[[command]]
name = "agy"
args = "[status|[--model M] [--effort E] [--mode MODE] [--worktree] <prompt>]"
subcommands = ["status"]
hint = "agy CLI status or prompt"
help = "check agy CLI status or run a prompt via the official agy binary"
