[[settings]]
key = "shell.input_wait_ms"
type = "integer"
tab = "shell"
default = 3000
description = "Quiet wait in milliseconds after writing input to `proc://<id>`."

[[settings]]
key = "shell.patterns"
type = "array"
tab = "shell"
