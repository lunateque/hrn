[[settings]]
key = "shell.interceptor.patterns"
type = "array"
tab = "shell"
default = []
merge = "prepend"
path_scoped = true
description = "Ordered regex rules redirecting `bash` invocations to dedicated tools."

[[settings]]
key = "desktop.display"
type = "string"
tab = "desktop"
