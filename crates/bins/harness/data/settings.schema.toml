description = "Default monitor selector for desktop captures."

[[settings]]
key = "desktop.max_width"
type = "integer"
tab = "desktop"
default = 3840
description = "Maximum capture width in physical pixels."

[[settings]]
key = "desktop.max_height"
type = "integer"
tab = "desktop"
default = 2400
description = "Maximum capture height in physical pixels."

[[settings]]
key = "desktop.background_fallback"
type = "string"
tab = "desktop"
default = "takeover"
values = ["takeover", "refuse"]
description = "Fallback policy when background window input is unavailable."

[[settings]]
key = "desktop.eval_prelude"
type = "bool"
tab = "desktop"
default = true
operator_no_loosen = true
