[[settings]]
key = "eval.py"
type = "bool"
tab = "eval"
default = true
operator_no_loosen = true
description = "Enable the persistent Python (`py`) interpreter backend in `eval`."

[[settings]]
key = "eval.js"
type = "bool"
tab = "eval"
default = true
operator_no_loosen = true
description = "Enable the persistent JavaScript (`js`) interpreter backend in `eval`."

[[settings]]
key = "eval.tools_enabled"
type = "bool"
tab = "eval"
default = true
