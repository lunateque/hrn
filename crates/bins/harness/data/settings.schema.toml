[[settings]]
key = "browser.relay"
type = "bool"
tab = "browser"
default = false
description = "Default to the user's Chrome via the native browser relay."

[[settings]]
key = "browser.cdp_url"
type = "string"
tab = "browser"
env = "HRN_BROWSER_CDP_URL"
description = "Explicit Chrome DevTools Protocol HTTP/WebSocket endpoint."

[[settings]]
key = "browser.binary"
type = "string"
tab = "browser"
env = "HRN_BROWSER_BIN"
description = "Explicit Chromium/Chrome/Edge executable path."

[[settings]]
key = "browser.headless"
type = "bool"
tab = "browser"
default = true
description = "Launch managed browsers headlessly."

[[settings]]
key = "browser.screenshot_dir"
type = "string"
tab = "browser"
description = "Optional directory where captured browser screenshots are also saved."

[[settings]]
key = "hooks.discover_claude_settings"
type = "bool"
tab = "hooks"
default = false
description = "Discover Claude Code hook entries from ~/.claude/settings.json."

[[settings]]
key = "web.api_key"
type = "string"
tab = "web"
secret = true
description = "Optional API key for configured web search providers."

[[settings]]
key = "task.max_concurrency"
type = "integer"
tab = "task"
default = 32
description = "Maximum concurrently running subagents per session tree."

[[settings]]
key = "task.max_recursion_depth"
type = "integer"
tab = "task"
default = 2
description = "Maximum nesting depth for recursive subagent calls."

[[settings]]
key = "task.soft_request_budget"
type = "integer"
tab = "task"
default = 200
description = "Soft LLM request budget per subagent run (1.5x enforces a hard stop; 0 disables)."

[[settings]]
key = "task.max_steps"
type = "integer"
tab = "task"
default = 150
description = "Per-turn step budget of a subagent whose profile and `task.agent_max_steps` entry have no own limit (0 = unlimited)."

[[settings]]
key = "task.max_runtime_ms"
type = "integer"
tab = "task"
default = 0
description = "Maximum wall-clock runtime per subagent run in milliseconds (0 = unlimited)."

[[settings]]
key = "task.agent_idle_ttl_ms"
type = "integer"
tab = "task"
default = 420000
description = "Idle duration in milliseconds before a completed subagent transitions to parked."

[[settings]]
key = "task.async"
type = "bool"
tab = "task"
default = true
description = "Run spawned subagents asynchronously in the background."

[[settings]]
key = "task.batch"
type = "bool"
tab = "task"
default = true
description = "Accept batched `tasks[]` arrays in one `task` tool call."

[[settings]]
key = "task.steps"
type = "bool"
tab = "task"
default = false
description = "Expose multi-step `steps[]` chains on `task` items."

[[settings]]
key = "task.enable_effort"
type = "bool"
tab = "task"
default = false
description = "Expose per-item `effort` overrides on `task` items."

[[settings]]
key = "task.per_call_model"
type = "string"
tab = "task"
default = "off"
values = ["off", "eval", "on"]
description = "Policy gating per-call `model` overrides on `task` items."

[[settings]]
key = "task.per_call_model_allow"
type = "array"
tab = "task"
default = []
description = "Optional allowlist of `provider/id` selectors permitted for per-call task `model` overrides."

[[settings]]
key = "task.agent_models"
type = "table"
tab = "task"
default = {}
description = "Per-agent model selector overrides (`[task.agent_models] <agent> = \"<selector>\"`)."

[[settings]]
key = "task.agent_max_steps"
type = "table"
tab = "task"
default = { scout = 100, sonic = 60, task = 200, plan = 120, reviewer = 100, security-reviewer = 100 }
description = "Per-agent step budgets (`[task.agent_max_steps] <agent> = <n>`, 0 = unlimited); missing agents use `task.max_steps`."

[[settings]]
key = "task.structured"
type = "bool"
tab = "task"
default = false
description = "Expose structured `outputSchema` / `schemaMode` fields on `task` items."

[[settings]]
key = "task.disabled_agents"
type = "array"
tab = "task"
default = []
description = "Subagent profile names disabled from spawning."

[[settings]]
key = "task.isolation.enabled"
type = "bool"
tab = "task"
default = false
description = "Allow `isolated: true` tasks to run inside dedicated git worktrees."

[[settings]]
key = "task.isolation.merge"
type = "string"
tab = "task"
default = "patch"
values = ["patch", "branch"]
description = "How isolated worktree edits are returned (`patch` or `branch`)."

[[settings]]
key = "task.isolation.apply"
type = "bool"
tab = "task"
default = false
description = "Automatically apply captured isolation patches to the parent working tree."

[[settings]]
key = "compaction.enabled"
type = "bool"
tab = "compaction"
default = true
description = "Enable automatic context compaction when context usage crosses thresholds or overflows."

[[settings]]
key = "compaction.threshold_percent"
type = "integer"
tab = "compaction"
default = -1
description = "Percentage of context window that triggers compaction (-1 uses window minus reserve)."

[[settings]]
key = "compaction.threshold_tokens"
type = "integer"
tab = "compaction"
default = -1
description = "Absolute token count triggering compaction (-1 = unset; positive values override threshold_percent)."

[[settings]]
key = "compaction.reserve_tokens"
type = "integer"
tab = "compaction"
description = "Explicit reserve token floor kept free for output (unset uses max(15% * window, 16384))."

[[settings]]
key = "compaction.keep_recent_tokens"
type = "integer"
tab = "compaction"
default = 20000
description = "Target token budget of newest history kept verbatim during summary compaction."

[[settings]]
key = "compaction.mid_turn_enabled"
type = "bool"
tab = "compaction"
default = true
description = "Allow threshold compaction between steps of a single turn (false defers until post-turn)."

[[settings]]
key = "compaction.auto_continue"
type = "bool"
tab = "compaction"
default = true
description = "Automatically resume after compaction or recovery when compaction reduced context size."

[[settings]]
key = "compaction.async_enabled"
type = "bool"
tab = "compaction"
default = true
description = "Speculatively prepare a background compaction summary when approaching the compaction threshold."

[[settings]]
key = "compaction.method_order"
type = "array"
tab = "compaction"
default = ["handoff", "shake", "summary"]
description = "Ordered list of compaction methods tried until one commits (`soft` aliases `summary`)."

[[settings]]
key = "compaction.model_thresholds"
type = "table"
tab = "compaction"
description = "Per-model compaction threshold overrides (`N`, `fN`, or `N%`; exact key or longest `provider/...*` prefix)."

[[settings]]
key = "compaction.idle.enabled"
type = "bool"
tab = "compaction"
default = false
description = "Enable automatic idle-session compaction after inactivity."

[[settings]]
key = "compaction.idle.threshold_tokens"
type = "integer"
tab = "compaction"
default = 200000
description = "Minimum estimated session tokens required before idle compaction triggers."

[[settings]]
key = "compaction.idle.timeout_secs"
type = "integer"
tab = "compaction"
default = 300
description = "Inactivity timeout in seconds before idle compaction runs (clamped to min 60s when enabled)."

[[settings]]
key = "share.store"
type = "string"
tab = "share"
default = "blob"
values = ["blob", "gist"]
operator_no_loosen = true
description = "Backend store for sealed session shares (`blob` posts to `share.server`; `gist` runs `gh gist create`)."

[[settings]]
key = "share.server"
type = "string"
tab = "share"
default = ""
env = "HRN_SHARE_SERVER"
operator_no_loosen = true
description = "Base URL of the blob server for `[share] store = \"blob\"` (e.g. local/LAN hrn-relay)."

[[settings]]
key = "share.redact"
type = "bool"
tab = "share"
default = true
operator_no_loosen = true
description = "Redact secret patterns from shared session snapshots by default."

[[settings]]
key = "collab.relay"
type = "string"
tab = "collab"
default = ""
env = "HRN_COLLAB_RELAY"
operator_no_loosen = true
description = "Base URL of the live collaboration WebSocket relay (e.g. local/LAN hrn-relay)."
